command:
  - /opt/keycloak/bin/kc.sh
  - start
  - --http-enabled=true
  - --hostname-strict=false
  - --proxy-headers=xforwarded

http:
  relativePath: "/"

podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

database:
  vendor: postgres
  hostname: postgres.keycloak.svc.cluster.local
  port: 5432
  existingSecret: keycloak-credentials
  existingSecretKey: DB_PASSWORD

extraEnv: |
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    valueFrom:
      secretKeyRef:
        name: keycloak-credentials
        key: ADMIN_USERNAME
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-credentials
        key: ADMIN_PASSWORD
  - name: KC_HOSTNAME
    value: https://keycloak.bhpc.dev
  - name: KC_DB_URL_DATABASE
    valueFrom:
      secretKeyRef:
        name: keycloak-credentials
        key: DB_NAME
  - name: KC_DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: keycloak-credentials
        key: DB_USER
