# Expects a secret named `oauth2-proxy-credentials` with the keys
# `client-id`, `client-secret`, and `cookie-secret`
config:
  existingSecret: oauth2-proxy-credentials
  configFile: |-
    provider = "keycloak-oidc"
    oidc_issuer_url = "https://keycloak.bhpc.dev/realms/bhpc"
    redirect_url = "https://prometheus.bhpc.dev/oauth2/callback"
    scope = "openid profile email groups"
    oidc_groups_claim = "groups"
    allowed_groups = ["PrometheusUsers"]
    email_domains = ["*"]
    code_challenge_method = "S256"

    # Proxy authenticated requests straight through to Prometheus
    upstreams = ["http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"]

    http_address = "0.0.0.0:4180"
    reverse_proxy = true
    skip_provider_button = true
    cookie_secure = true

replicaCount: 1

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 128Mi
