fullnameOverride: kube-prometheus-stack

prometheus:
  prometheusSpec:
    retention: 90d
    retentionSize: 100GiB
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    externalUrl: https://prometheus.bhpc.dev
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

grafana:
  enabled: true
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  initChownData:
    enabled: false
  # Provides GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET to the container environment
  envFromSecret: grafana-oidc
  grafana.ini:
    server:
      domain: grafana.bhpc.dev
      root_url: https://grafana.bhpc.dev
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      client_id: grafana
      scopes: openid profile email groups offline_access
      auth_url: https://keycloak.bhpc.dev/realms/bhpc/protocol/openid-connect/auth
      token_url: https://keycloak.bhpc.dev/realms/bhpc/protocol/openid-connect/token
      api_url: https://keycloak.bhpc.dev/realms/bhpc/protocol/openid-connect/userinfo
      signout_redirect_url: https://keycloak.bhpc.dev/realms/bhpc/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Fgrafana.bhpc.dev%2Flogin
      use_pkce: true
      use_refresh_token: true
      allow_sign_up: true
      login_attribute_path: preferred_username
      groups_attribute_path: groups
      role_attribute_path: "contains(groups[*], 'GrafanaAdmins') && 'GrafanaAdmin' || contains(groups[*], 'GrafanaReaders') && 'Viewer'"
      role_attribute_strict: true
      allow_assign_grafana_admin: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 64Mi

# k3s-style clusters don't expose these control plane endpoints for scraping,
# so leaving them enabled only produces permanently firing alerts
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
