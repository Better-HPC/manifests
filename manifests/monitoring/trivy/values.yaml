operator:
  scanJobsConcurrentLimit: 5
  clusterComplianceEnabled: true
  infraAssessmentScannerEnabled: true
  rbacAssessmentScannerEnabled: true
  exposedSecretScannerEnabled: true
  configAuditScannerEnabled: true
  vulnerabilityScannerEnabled: true

trivy:
  ignoreUnfixed: true
  severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
  resources:
    requests:
      cpu: 100m
      memory: 100M
    limits:
      cpu: 500m
      memory: 500M

compliance:
  failEntriesLimit: 10
  reportType: summary
  cron: "0 */6 * * *"
  specs:
    - k8s-cis-1.23
    - k8s-nsa-1.0
    - k8s-pss-baseline-0.1
    - k8s-pss-restricted-0.1

serviceMonitor:
  enabled: false
  labels:
    release: kube-prometheus-stack

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL
