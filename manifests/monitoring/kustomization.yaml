apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: trivy-operator
    version: 0.33.2
    releaseName: monitoring-operator
    repo: https://aquasecurity.github.io/helm-charts/
    valuesFile: trivy/values.yaml
    includeCRDs: true

  - name: kube-prometheus-stack
    version: 75.15.1
    releaseName: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    valuesFile: prometheus/values.yaml
    includeCRDs: true

  # Authenticating reverse proxy in front of Prometheus, which has no login of its own
  - name: oauth2-proxy
    version: 10.0.0
    releaseName: oauth2-proxy
    repo: https://oauth2-proxy.github.io/manifests
    valuesFile: oauth2-proxy/values.yaml

resources:
  - prometheus/ingress.yaml
  - prometheus/secrets.yaml
