apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

helmCharts:
  - name: argo-cd
    version: 9.4.17
    releaseName: argocd
    namespace: argocd
    repo: https://argoproj.github.io/argo-helm
    valuesFile: argocd/values.yaml

resources:
  - namespace.yaml
  - argocd/ingress.yaml
  - argocd/applications.yaml
  - argocd/secrets.yaml
