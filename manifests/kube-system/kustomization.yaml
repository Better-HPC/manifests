apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: sealed-secrets
    repo: https://bitnami.github.io/sealed-secrets
    version: 2.18.6
    releaseName: sealed-secrets
    includeCRDs: true
    valuesInline:
      fullnameOverride: sealed-secrets-controller

resources:
  - namespace.yaml
  - core-dns/config.yaml
  - network-policies/intra-namespace.yaml
  - network-policies/ingress-exceptions.yaml
  - traefik/config.yaml
  - traefik/secrets.yaml

