apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trivy-operator
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: porkbun

spec:
  ingressClassName: traefik
  rules:
    - host: trivy.bhpc.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trivy-operator
                port:
                  number: 80

  tls:
    - hosts:
        - trivy.bhpc.dev
